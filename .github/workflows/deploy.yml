name: Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repo checkout करा
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup SSH key
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 13.233.63.73 >> ~/.ssh/known_hosts

      # 3️⃣ Test SSH connection
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@13.233.63.73 "echo SSH is working!"

      # 4️⃣ Deploy to EC2
      - name: Deploy to EC2
        run: |
          echo "🔍 Local repo content:"
          ls -la

          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
          --rsync-path="sudo rsync" ./ ubuntu@13.233.63.73:/var/www/restoscan-backend-laravel/

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@13.233.63.73 "
            sudo chown -R ubuntu:www-data /var/www/restoscan-backend-laravel &&
            sudo chmod -R 775 /var/www/restoscan-backend-laravel &&
            git config --global --add safe.directory /var/www/restoscan-backend-laravel &&
            cd /var/www/restoscan-backend-laravel &&
            if [ -f composer.json ]; then
              composer install --no-dev --optimize-autoloader
            else
              echo '⚠️ composer.json not found, skipping composer install'
            fi &&
            sudo systemctl restart nginx

          "
